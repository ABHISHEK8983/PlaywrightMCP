name: Playwright Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      test_suite:
        description: Test suite to run
        type: choice
        options:
          - test:api
          - test:web
          - test:all
        default: test:web
      browser:
        description: Browser to run tests on
        type: choice
        options:
          - chromium
          - firefox
          - webkit
        default: chromium
      mode:
        description: Mode to run tests in
        type: choice
        options:
          - headless
          - headed
        default: headless

jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        shell: pwsh
        env:
          CI: "1"
        run: |
          $suite = "${{ github.event.inputs.test_suite || 'test:web' }}"
          $browser = "${{ github.event.inputs.browser || 'chromium' }}"
          $mode = "${{ github.event.inputs.mode || 'headless' }}"
          $tag = $suite -replace 'test:', ''

          if ($mode -eq 'headed') {
            npx playwright test --grep "@$tag" --project=$browser --headed --reporter=line
          }
          else {
            npx playwright test --grep "@$tag" --project=$browser --reporter=line
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/
          retention-days: 30      
